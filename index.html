<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>PE03 - Bouncing Ball Screensaver</title>

        <style>
            body {
                margin: 0;
                background-color: #000;
                color: white;
                font-family: Arial, sans-serif;
                text-align: center;
            }

            h1 {
                margin: 20px;
            }

            canvas {
                background-color: black;
                border: 2px solid white;
                display: block;
                margin: 0 auto;
            }
        </style>
    </head>

    <body>
        <h1>Bouncing Ball Screensaver</h1>

        <canvas id="screensaver" width="800" height="500">
            Your browser does not support the HTML5 canvas element.
        </canvas>

        <script>
            const canvas = document.getElementById("screensaver");
            const ctx = canvas.getContext("2d");

            //step 1. store the ball's data in an object
            const ball = {
                x: 100,
                y: 100,
                radius: 20,
                dx: 3,
                dy: 2,
                color: "red"
            };

            //step 2. draw the ball on the canvas
            function drawBall(ball) {
                ctx.beginPath();
                ctx.arc(
                    ball.x,
                    ball.y,
                    ball.radius,
                    0,
                    Math.PI * 2
                );
                ctx.fillStyle = ball.color;
                ctx.fill();
            }

            //step 3. update position and detect wall collisions
            function updateBall(ball) {
                ball.x += ball.dx;
                ball.y += ball.dy;

                if (ball.x + ball.radius >= canvas.width || ball.x - ball.radius <= 0) {
                    ball.dx *= -1;
                }
                if (ball.y + ball.radius >= canvas.height || ball.y - ball.radius <= 0) {
                    ball.dy *= -1;
                }
            }

            //step 4. run animation
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                updateBall(ball);
                drawBall(ball);
                
                requestAnimationFrame(animate);
            }

            animate();
        </script>
    </body>
</html>
